[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 1
fs_permissions = [{ access = "read-write", path = "./" }]
code_size_limit = 50000  # tests only: local Uniswap NPM is >24KB; XiyangMiner itself is 21.4KB
evm_version = "shanghai"
remappings = [
  "oz5/=lib/openzeppelin-contracts/contracts/",
  # @openzeppelin/contracts is only used by Uniswap periphery (needs OpenZeppelin 4.x)
  "@openzeppelin/contracts/=lib/openzeppelin-contracts-v4/contracts/",
  "v3-core/=lib/v3-core/",
  "v3-periphery/=lib/v3-periphery/",
  "@uniswap/v3-core/=lib/v3-core/",
  "@uniswap/v3-periphery/=lib/v3-periphery/",
  "forge-std/=lib/forge-std/src/",
]
# Local test pools are compiled from Uniswap V3 0.8 sources (pinned to solc 0.8.12/0.8.15).
# NonfungiblePositionManager exceeds 24KB without heavy optimisation; tests run with the size limit lifted.
[profile.default.fuzz]
runs = 256

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
